<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBox</title>

    <script src="https://sdk.twilio.com/js/video/releases/2.35.0/twilio-video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>

    <link rel="stylesheet" href="/css/chat.css">
</head>

<body>

<div id="loginScreen">
    <div class="login-box">
        <h1>🔐 ChatBox</h1>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            autocomplete="current-password">

        <button onclick="login()">Enter Chat</button>

        <p id="loginError"></p>
    </div>
</div>


<div id="chatScreen" style="display:none;">

    <!-- NORMAL HEADER -->
    <header class="chat-header" id="normalHeader">
        <div>
            <h2>💬 ChatBox</h2>
            <span id="otherStatus">⚫ Offline</span>
        </div>

        <div class="header-right">
            <span id="connectionStatus">Connecting...</span>

            <div class="call-buttons" id="callButtons">
                <button
                    id="voiceCallButton"
                    class="call-button"
                    title="Voice Call"
                    onclick="startVoiceCall()">☎️</button>

                <button
                    id="videoCallButton"
                    class="call-button"
                    title="Video Call"
                    onclick="startVideoCall()">📹</button>
            </div>
        </div>
    </header>


    <!-- MESSAGE SELECTION HEADER -->
    <div id="selectionToolbar" class="selection-toolbar" style="display:none;">

        <button
            type="button"
            id="selectionCloseButton"
            class="selection-icon-button"
            title="Cancel">
            ✕
        </button>

        <span id="selectionCount">1</span>

        <div class="selection-actions">

            <button
                type="button"
                id="selectionReplyButton"
                title="Reply">
                ↩️
            </button>

            <button
                type="button"
                id="selectionEditButton"
                title="Edit">
                ✏️
            </button>

            <button
                type="button"
                id="selectionDeleteButton"
                title="Delete">
                🗑️
            </button>

        </div>
    </div>


    <!-- EMOJI REACTION PICKER -->
    <div id="reactionPicker" class="reaction-picker" style="display:none;">

        <button type="button" data-emoji="❤️">❤️</button>
        <button type="button" data-emoji="😂">😂</button>
        <button type="button" data-emoji="😮">😮</button>
        <button type="button" data-emoji="😢">😢</button>
        <button type="button" data-emoji="😡">😡</button>
        <button type="button" data-emoji="👍">👍</button>

    </div>


    <!-- MESSAGES -->
    <main id="messages"></main>


    <!-- REPLY / EDIT PREVIEW -->
    <div id="composerPreview" class="composer-preview" style="display:none;">

        <div class="composer-preview-line">
            <div>
                <strong id="composerPreviewTitle"></strong>
                <div id="composerPreviewText"></div>
            </div>

            <button
                type="button"
                id="composerPreviewClose"
                title="Cancel">
                ✕
            </button>
        </div>

    </div>


    <!-- INPUT -->
    <footer class="chat-input-area">

        <button
            type="button"
            id="imageButton"
            class="image-button"
            title="Send image"
            onclick="selectImage()">
            🖼️
        </button>

        <input
            type="file"
            id="imageInput"
            accept="image/jpeg,image/png,image/webp"
            style="display:none"
            onchange="handleImageSelected(event)">

        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            maxlength="2000"
            autocomplete="off">

        <button
            type="button"
            id="sendButton"
            onclick="sendMessage()">
            ➤
        </button>

    </footer>

</div>


<!-- INCOMING CALL -->
<div id="incomingCallPopup" class="call-popup" style="display:none;">

    <div class="call-popup-box">

        <div class="call-icon">📞</div>

        <h2 id="incomingCaller">Incoming Call</h2>

        <p id="incomingCallType">Voice call</p>

        <div class="incoming-call-buttons">

            <button
                class="accept-call"
                onclick="acceptIncomingCall()">
                ✅ Accept
            </button>

            <button
                class="reject-call"
                onclick="rejectIncomingCall()">
                ❌ Reject
            </button>

        </div>

    </div>

</div>


<!-- ACTIVE CALL -->
<div id="activeCallScreen" class="active-call-screen" style="display:none;">

    <div class="active-call-header">

        <span id="activeCallUser">Calling...</span>

        <span id="activeCallStatus">Connecting...</span>

    </div>


    <div id="videoArea" class="video-area">

        <video
            id="remoteVideo"
            autoplay
            playsinline>
        </video>

        <video
            id="localVideo"
            autoplay
            muted
            playsinline>
        </video>

    </div>


    <div class="call-controls">

        <button
            id="muteButton"
            onclick="toggleMute()">
            🔇 Mute
        </button>

        <button
            id="cameraButton"
            onclick="toggleCamera()">
            📷 Camera
        </button>

        <button
            class="end-call"
            onclick="endCall()">
            🔴 End Call
        </button>

    </div>

</div>


<script src="/js/chat.js"></script>

</body>
</html>
