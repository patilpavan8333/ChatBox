<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChatBox</title>

	 <script src="https://sdk.twilio.com/js/video/releases/2.35.0/twilio-video.min.js"></script>
	 <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>

    <link rel="stylesheet" href="/css/chat.css">
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

    <div class="login-box">

        <h1>🔐 ChatBox</h1>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
        >

        <button onclick="login()">
            Enter Chat
        </button>

        <p id="loginError"></p>

    </div>

</div>


<!-- CHAT -->

<div
    id="chatScreen"
    style="display:none;"
>

    <!-- HEADER -->

    <header class="chat-header">

        <div>

            <h2>💬ChatBox</h2>

            <span id="otherStatus">
                ⚫ Offline
            </span>

        </div>


        <div class="header-right">

            <span id="connectionStatus">
                Connecting...
            </span>

            <!-- CALL BUTTONS -->

            <div
                class="call-buttons"
                id="callButtons"
            >

                <button
                    id="voiceCallButton"
                    class="call-button"
                    title="Voice Call"
                    onclick="startVoiceCall()"
                >
                    ☎️
                </button>

                <button
                    id="videoCallButton"
                    class="call-button"
                    title="Video Call"
                    onclick="startVideoCall()"
                >
                    📹
                </button>

            </div>

        </div>

    </header>


    <!-- MESSAGES -->

    <main id="messages"></main>


    <!-- MESSAGE INPUT -->

<footer class="chat-input-area">

    <button
        type="button"
        id="imageButton"
        class="image-button"
        title="Send image"
        onclick="selectImage()"
    >
        🖼️
    </button>

    <input
        type="file"
        id="imageInput"
        accept="image/jpeg,image/png,image/webp"
        style="display:none"
        onchange="handleImageSelected(event)"
    >

    <input
        type="text"
        id="messageInput"
        placeholder="Type a message..."
        maxlength="2000"
    >

    <button
        type="button"
        onclick="sendMessage()"
    >
        ➤
    </button>

</footer>
</div>


<!-- INCOMING CALL POPUP -->

<div
    id="incomingCallPopup"
    class="call-popup"
    style="display:none;"
>

    <div class="call-popup-box">

        <div class="call-icon">
            📞
        </div>

        <h2 id="incomingCaller">
            Incoming Call
        </h2>

        <p id="incomingCallType">
            Voice call
        </p>

        <div class="incoming-call-buttons">

            <button
                class="accept-call"
                onclick="acceptIncomingCall()"
            >
                ✅ Accept
            </button>

            <button
                class="reject-call"
                onclick="rejectIncomingCall()"
            >
                ❌ Reject
            </button>

        </div>

    </div>

</div>


<!-- ACTIVE CALL -->

<div
    id="activeCallScreen"
    class="active-call-screen"
    style="display:none;"
>

    <div class="active-call-header">

        <span id="activeCallUser">
            Calling...
        </span>

        <span id="activeCallStatus">
            Connecting...
        </span>

    </div>


    <!-- VIDEO AREA -->

    <div
        id="videoArea"
        class="video-area"
    >

        <video
            id="remoteVideo"
            autoplay
            playsinline
        ></video>

        <video
            id="localVideo"
            autoplay
            muted
            playsinline
        ></video>

    </div>


    <!-- CALL CONTROLS -->

    <div class="call-controls">

        <button
            id="muteButton"
            onclick="toggleMute()"
        >
            🔇 Mute
        </button>

        <button
            id="cameraButton"
            onclick="toggleCamera()"
        >
            📷 Camera
        </button>

        <button
            class="end-call"
            onclick="endCall()"
        >
            🔴 End Call
        </button>

    </div>

</div>


<script src="/js/chat.js"></script>

</body>
</html>
